name: nordstrat

services:
  nginx:
    image: ${NGINX_IMAGE:-nordstrat-nginx:local}
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTP_PORT:-8080}:8080"
    volumes:
      - uploads_data:/srv/uploads:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_db.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  migrate:
    image: ${APP_IMAGE:-nordstrat-website:local}
    build:
      context: .
      target: runtime
    env_file:
      - ${ENV_FILE:-.env.docker}
    command: ["npm", "run", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  seed:
    image: ${APP_IMAGE:-nordstrat-website:local}
    build:
      context: .
      target: runtime
    env_file:
      - ${ENV_FILE:-.env.docker}
    command: ["npm", "run", "seed:games"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  app:
    image: ${APP_IMAGE:-nordstrat-website:local}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    env_file:
      - ${ENV_FILE:-.env.docker}
    expose:
      - "3000"
    volumes:
      - uploads_data:/app/data/uploads
      - archives_data:/app/data/archives
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend
      - backend

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  uploads_data:
  archives_data:
